<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peer Finder — Competitors &amp; Talent Peers</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1a1d24; --mut:#667085; --line:#e4e7ec;
    --acc:#2f6feb; --acc-d:#1f4fc0; --good:#12894f; --good-bg:#e7f5ee;
    --warn:#9a6a00; --warn-bg:#fff7e6; --warn-line:#f0d58a; --chip:#eef2f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  header .wrap{padding:22px 20px 24px}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--mut);font-size:13.5px;margin:0}
  /* search */
  .search{position:relative;display:flex;gap:10px;margin-top:18px}
  .search .field{position:relative;flex:1}
  input{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink);outline:none}
  input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,111,235,.12)}
  button{padding:12px 22px;font-size:15px;font-weight:600;color:#fff;background:var(--acc);
    border:0;border-radius:10px;cursor:pointer;white-space:nowrap}
  button:hover{background:var(--acc-d)}
  button:disabled{opacity:.55;cursor:default}
  #ac{position:absolute;top:48px;left:0;right:0;z-index:9;background:#fff;
    border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.08);
    overflow:hidden;display:none;max-height:300px;overflow-y:auto}
  #ac div{padding:10px 14px;cursor:pointer;font-size:14.5px}
  #ac div:hover,#ac div.sel{background:#f0f4fb}
  /* status */
  #status{margin:14px 0 2px;min-height:18px}
  .prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;display:none}
  .prog>i{display:block;height:100%;width:0;background:var(--acc);transition:width .35s ease}
  .msg{font-size:13px;color:var(--mut);margin-top:7px}
  .banner{margin:12px 0 0;padding:11px 14px;border-radius:10px;font-size:13.5px;
    background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);display:none}
  .banner.err{background:#fdecec;color:#b42318;border-color:#f3b4ae}
  /* results */
  main{padding:22px 0 70px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:800px){.cols{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card>h2{margin:0;padding:14px 18px;font-size:15px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center}
  .count{font-size:12.5px;font-weight:600;color:var(--mut);background:var(--chip);
    padding:2px 9px;border-radius:20px}
  .list{max-height:none}
  .item{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:13px 18px;
    border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .rank{width:28px;height:28px;border-radius:50%;background:var(--chip);color:var(--mut);
    font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .top .rank{background:#e7eefc;color:var(--acc)}
  .name{font-weight:600;font-size:14.5px}
  .chip{font-size:11px;font-weight:600;color:var(--mut);background:var(--chip);
    border-radius:5px;padding:1px 6px;margin-left:7px;vertical-align:middle}
  .ex{color:var(--mut);font-size:12.7px;margin-top:3px}
  .scorebar{display:flex;align-items:center;gap:8px;margin-top:6px}
  .scorebar .track{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
  .scorebar .track>i{display:block;height:100%;background:var(--good)}
  .scorebar .val{font-size:12px;font-variant-numeric:tabular-nums;color:var(--good);font-weight:600}
  .empty{padding:40px 18px;text-align:center;color:var(--mut);font-size:13.5px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Peer Finder</h1>
    <p class="sub">Pick a company from the 500-company directory to find its direct business competitors and the employers competing for the same talent.</p>
    <div class="search">
      <div class="field">
        <input id="q" autocomplete="off" placeholder="Search a company — e.g. Salesforce, Snowflake, Stripe">
        <div id="ac"></div>
      </div>
      <button id="go">Find peers</button>
    </div>
    <div id="status">
      <div class="prog"><i id="pbar"></i></div>
      <div class="msg" id="msg"></div>
      <div class="banner" id="banner"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="cols">
    <section class="card">
      <h2>Direct Business Competitors <span class="count" id="bcount">0 / 25</span></h2>
      <div class="list" id="biz"><div class="empty">Run a search to see competitors.</div></div>
    </section>
    <section class="card">
      <h2>Talent Peers <span class="count" id="tcount">0 / 25</span></h2>
      <div class="list" id="tal"><div class="empty">Run a search to see talent peers.</div></div>
    </section>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const q = $('#q'), ac = $('#ac'), go = $('#go');
let items = [], selIdx = -1, timer;

function hideAc(){ ac.style.display='none'; selIdx=-1; }
function showAc(list){
  items = list; selIdx = -1;
  ac.innerHTML = list.map(i => `<div data-n="${i.name.replace(/"/g,'&quot;')}">${i.name}</div>`).join('');
  ac.style.display = list.length ? 'block' : 'none';
}
q.addEventListener('input', () => {
  clearTimeout(timer);
  const v = q.value.trim();
  if (!v){ hideAc(); return; }
  timer = setTimeout(async () => {
    const r = await fetch('/api/search?q=' + encodeURIComponent(v));
    showAc(await r.json());
  }, 140);
});
q.addEventListener('keydown', e => {
  if (ac.style.display==='block' && items.length){
    if (e.key==='ArrowDown'){ e.preventDefault(); selIdx=(selIdx+1)%items.length; }
    else if (e.key==='ArrowUp'){ e.preventDefault(); selIdx=(selIdx-1+items.length)%items.length; }
    else if (e.key==='Enter' && selIdx>=0){ e.preventDefault(); q.value=items[selIdx].name; hideAc(); return; }
    [...ac.children].forEach((c,i)=>c.classList.toggle('sel',i===selIdx));
    if (e.key==='ArrowDown'||e.key==='ArrowUp') return;
  }
  if (e.key==='Enter'){ hideAc(); go.click(); }
});
ac.addEventListener('click', e => { if(e.target.dataset.n){ q.value=e.target.dataset.n; hideAc(); } });
document.addEventListener('click', e => { if(!ac.contains(e.target) && e.target!==q) hideAc(); });

function renderList(el, countEl, rows){
  countEl.textContent = rows.length + ' / 25';
  if (!rows.length){ el.innerHTML = '<div class="empty">No qualifying companies.</div>'; return; }
  el.innerHTML = rows.map(r => `
    <div class="item ${r.rank<=3?'top':''}">
      <div class="rank">${r.rank}</div>
      <div>
        <div><span class="name">${r.name}</span>${r.confidence==='low'?'<span class="chip">low confidence</span>':''}</div>
        <div class="ex">${r.explanation}</div>
        <div class="scorebar"><div class="track"><i style="width:${Math.min(100,r.score*100)}%"></i></div><span class="val">${r.score.toFixed(3)}</span></div>
      </div>
    </div>`).join('');
}

function setBanner(text, isErr){
  const b = $('#banner');
  if (!text){ b.style.display='none'; return; }
  b.className = 'banner' + (isErr?' err':'');
  b.textContent = (isErr?'⚠ ':'⚠ ') + text;
  b.style.display = 'block';
}

async function poll(id){
  const d = await (await fetch('/api/run?id=' + id)).json();
  $('#pbar').style.width = Math.round((d.progress||0)*100) + '%';
  $('#msg').textContent = d.status==='done' ? 'Done.'
    : d.status==='error' ? 'Error.' : 'Working — ' + (d.stage||'…');
  renderList($('#biz'), $('#bcount'), d.business);
  renderList($('#tal'), $('#tcount'), d.talent);
  setBanner(d.blocker, d.status==='error');
  if (d.status==='running') setTimeout(()=>poll(id), 650);
  else { go.disabled=false; $('#status .prog').style.display='none'; }
}

go.addEventListener('click', async () => {
  const company = q.value.trim();
  if (!company) return;
  go.disabled = true; hideAc(); setBanner('');
  $('#biz').innerHTML = $('#tal').innerHTML = '<div class="empty">Searching…</div>';
  $('#status .prog').style.display='block'; $('#pbar').style.width='0';
  $('#msg').textContent = 'Starting…';
  const d = await (await fetch('/api/find',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({company})})).json();
  if (d.error){ setBanner(d.error, true); $('#msg').textContent=''; go.disabled=false;
    $('#status .prog').style.display='none';
    $('#biz').innerHTML=$('#tal').innerHTML='<div class="empty">—</div>'; return; }
  poll(d.run_id);
});
</script>
</body>
</html>
